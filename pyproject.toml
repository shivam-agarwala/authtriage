[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authtriage"
version = "0.1.0"
description = "Defensive triage of OpenSSH auth logs: brute force, user enumeration, suspicious success"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
authtriage = "authtriage.cli:main"

[tool.setuptools.packages.find]
include = ["authtriage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# Lint for real errors, not line width. The advisory response strings in
# report.py read better unwrapped than split across three lines.
lint.select = ["E4", "E7", "E9", "F", "W"]
